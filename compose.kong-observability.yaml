services:
  payment-observability-a:
    build:
      context: ./services/payment-integration-service
    environment:
      SPRING_PROFILES_ACTIVE: gateway
      PARTNERBRIDGE_CLIENT_TRUSTED_IDENTITY_REQUIRED: "true"
      PARTNERBRIDGE_PROVIDER_A_BASE_URL: http://provider-a:8080
      PARTNERBRIDGE_PROVIDER_B_BASE_URL: http://provider-b:8080
      MANAGEMENT_INFO_ENV_ENABLED: "true"
      INFO_INSTANCE_ID: payment-observability-a
    depends_on:
      provider-a:
        condition: service_healthy
      provider-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - partner-bridge

  payment-observability-b:
    build:
      context: ./services/payment-integration-service
    environment:
      SPRING_PROFILES_ACTIVE: gateway
      PARTNERBRIDGE_CLIENT_TRUSTED_IDENTITY_REQUIRED: "true"
      PARTNERBRIDGE_PROVIDER_A_BASE_URL: http://provider-a:8080
      PARTNERBRIDGE_PROVIDER_B_BASE_URL: http://provider-b:8080
      MANAGEMENT_INFO_ENV_ENABLED: "true"
      INFO_INSTANCE_ID: payment-observability-b
    depends_on:
      provider-a:
        condition: service_healthy
      provider-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - partner-bridge

  kong-observability-lab:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8200
      KONG_ADMIN_LISTEN: 0.0.0.0:8201
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateways/kong/labs/observability/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8200:8200"
      - "127.0.0.1:8201:8201"
    depends_on:
      payment-observability-a:
        condition: service_healthy
      payment-observability-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - partner-bridge

  prometheus-observability:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./observability/kong-lab/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-observability-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      kong-observability-lab:
        condition: service_healthy
    networks:
      - partner-bridge

  grafana-observability:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: local-observability-only
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/kong-lab/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/kong-lab/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-observability-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus-observability:
        condition: service_started
    networks:
      - partner-bridge

volumes:
  prometheus-observability-data:
  grafana-observability-data:
